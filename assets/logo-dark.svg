<svg xmlns="http://www.w3.org/2000/svg" width="540" height="120" viewBox="0 0 540 120" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">offscript</title>
  <g transform="translate(14,22)">
    <!-- the script: a straight dashed track -->
    <path d="M38 54 H116" stroke="#475569" stroke-width="5" stroke-linecap="round" stroke-dasharray="7 9"/>
    <!-- the agent: follows the track, then veers off it -->
    <path d="M2 54 H34 C52 54 58 46 66 34 S80 10 92 8" fill="none" stroke="#F1F5F9" stroke-width="7" stroke-linecap="round"/>
    <!-- the catch -->
    <circle cx="94" cy="8" r="9" fill="#FF6A3D"/>
    <circle cx="94" cy="8" r="17" fill="none" stroke="#FF6A3D" stroke-width="2.5" opacity="0.45"/>
  </g>
  <text x="150" y="80" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="58" font-weight="700" letter-spacing="-1.5"><tspan fill="#FF6A3D">off</tspan><tspan fill="#F1F5F9">script</tspan></text>
</svg>
